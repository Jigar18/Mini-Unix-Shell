name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit + UI tests (Robolectric)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk RepoLens.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RepoLens-apk
          path: RepoLens.apk

      # R8 keeps class/method names (-dontobfuscate) but renumbers lines: this maps crash-report
      # stack traces back to exact source lines (retrace).
      - uses: actions/upload-artifact@v4
        with:
          name: RepoLens-mapping
          path: app/build/outputs/mapping/release/mapping.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: app/build/screenshots/

      # Pushes to the default branch publish a downloadable release (open it on your phone).
      - name: Publish release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RepoLens build ${{ github.run_number }}
          body: Install `RepoLens.apk` on your Android phone (allow "Install unknown apps" for your browser).
          files: RepoLens.apk
